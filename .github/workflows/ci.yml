name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --extra tracing

      - name: Lint and format check with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run test suite with 85% coverage gate
        run: |
          uv run pytest -q --cov=src/supplychain --cov-fail-under=85

      - name: Run scenario integration suite
        run: |
          uv run pytest tests/test_scenarios.py -q

      - name: Run architecture and boundary tests
        run: |
          uv run pytest tests/test_boundaries.py -q
